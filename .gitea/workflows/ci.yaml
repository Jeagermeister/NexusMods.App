name: CI

# Apocrypha's CI runs on the self-hosted Gitea (AWS EC2, tailnet-only), executed by the
# `framework-desktop` act_runner. GitHub is a push-and-release mirror only and runs nothing.
#
# This collapses three GitHub workflows into one file: pr-builds.yaml (which never ran tests),
# clean_environment_tests.yaml, and the reusable dotnet-build-and-test.yaml. The reusable-workflow
# indirection existed to share config with upstream NexusMods.App.Meta; the fork has no such
# sharing to do, and one file is far easier to reason about when a lane goes red.
#
# Deliberate differences from the GitHub originals:
#   - `jlumbroso/free-disk-space@main` is dropped. It exists to claw back space on GitHub's 14 GB
#     hosted runners; the desktop has terabytes.
#   - The pupnet AppImage build is not here. Packaging belongs to the release pipeline, not to
#     every PR -- see release.yaml.

on:
  push:
    branches: [ linux-fork ]
    paths:
      - ".gitea/workflows/ci.yaml"
      - "src/**"
      - "tests/**"
      - "**.props"
      - "**.targets"
      - "**.sln"
      - "**.csproj"
  pull_request:
    branches: [ linux-fork ]
    paths:
      - ".gitea/workflows/ci.yaml"
      - "src/**"
      - "tests/**"
      - "**.props"
      - "**.targets"
      - "**.sln"
      - "**.csproj"
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          # The fork vendors the game-hashes DB via git-lfs. Without this the checkout yields
          # text stubs instead of binaries, with no error -- a silent failure that breaks the
          # build confusingly far from its cause.
          lfs: true

      - name: Setup .NET 9.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Print debug info
        run: dotnet --info

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        env:
          # https://github.com/microsoft/vstest/issues/2952#issuecomment-2234253765
          # QUOTED DELIBERATELY. Unquoted `60000 #ms` parses as an integer once YAML strips the
          # trailing comment, and act silently DROPS a step whose env values are not strings --
          # no error, no warning, and the job still reports success. That produced a green CI
          # run with zero tests executed on the very first pipeline (2026-07-30).
          VSTEST_TESTHOST_SHUTDOWN_TIMEOUT: "60000"
        run: |
          dotnet test --no-restore --verbosity normal \
            --filter "RequiresNetworking!=True&FlakeyTest!=True" \
            --blame-hang-timeout 20m \
            --logger "trx;LogFilePrefix=results" \
            --results-directory "$GITHUB_WORKSPACE/TestResults"

      # Guard against the failure above recurring in any form. A test step that silently does
      # not run is worse than a failing one: it reports green forever. If no results landed,
      # no tests ran, and this job must not pass.
      #
      # The suite uses TWO test frameworks and they report differently:
      #   - VSTest projects honour `--logger trx` and write .trx into --results-directory.
      #   - TUnit / Microsoft.Testing.Platform projects (e.g. Apocrypha.Backend.Tests) do NOT
      #     emit .trx at all; they write their own log beside the test assembly, under
      #     tests/<Project>/bin/<Config>/<tfm>/TestResults/.
      # Counting only .trx therefore left every TUnit project invisible to this guard -- they
      # could stop running entirely and the count would be unchanged. That is precisely the
      # silent-skip failure this step exists to catch, so both are checked separately.
      - name: Verify tests actually ran
        run: |
          trx=$(find "$GITHUB_WORKSPACE/TestResults" -name '*.trx' 2>/dev/null | wc -l)
          mtp=$(find "$GITHUB_WORKSPACE/tests" -path '*/bin/*/TestResults/*.log' 2>/dev/null | wc -l)
          echo "VSTest .trx files:            $trx"
          echo "Testing-Platform result logs: $mtp"
          if [ "$trx" -eq 0 ]; then
            echo "::error::No .trx results were produced - the VSTest projects did not execute"
            exit 1
          fi
          if [ "$mtp" -eq 0 ]; then
            echo "::error::No Microsoft.Testing.Platform results were produced - the TUnit projects did not execute"
            exit 1
          fi
